name: Release

# Push a tag like v1.2.0 (or v1.3.0-rc1 for a pre-release) on a commit that is on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign and publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # keyless signing with the workflow's GitHub OIDC identity
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a release tag like v1.2.0 or v1.3.0-rc1"; exit 1
          fi
          # fetch-depth: 0 already fetched every branch; git has no credentials here (persist-credentials: false).
          git rev-parse --verify -q origin/main >/dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"; exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Build binaries, .deb packages and install.sh
        env:
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER }}
        run: |
          make deb VERSION="$TAG"
          dist/upsignal-agent-linux-amd64 version
          ls -l dist
          # GitHub silently renames assets with other characters, which breaks SHA256SUMS and install.sh.
          for f in dist/*; do
            case ${f#dist/} in
            *[!A-Za-z0-9._-]*) echo "::error::$f has characters GitHub would rewrite"; exit 1 ;;
            esac
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign SHA256SUMS
        # SHA256SUMS covers every artifact, so one signature vouches for all of them.
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Write release notes
        run: |
          version=${TAG#v}
          {
            echo "## Install"
            echo
            echo "On Ubuntu 22.04+ or Debian 12+ (amd64 or arm64):"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh"
            echo "less install.sh"
            echo "sudo sh install.sh"
            echo '```'
            echo
            echo "The installer verifies the package against \`SHA256SUMS\`, and verifies the \`SHA256SUMS\` signature too when [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) is installed. To check the files yourself:"
            echo
            echo '```bash'
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
            echo
            echo "## Build"
            echo
            echo "- Version: \`${version}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Toolchain: \`$(go version)\`"
            echo
          } > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $TAG in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" $prerelease \
            --notes-file release-notes.md --generate-notes \
            dist/upsignal-agent-linux-amd64 dist/upsignal-agent-linux-arm64 dist/*.deb \
            dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
