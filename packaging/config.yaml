# /etc/upsignal-agent/config.yaml — non-secret settings only. Restart the service after editing:
#   sudo systemctl restart upsignal-agent
# The agent credential is stored separately in /var/lib/upsignal-agent/agent-credential.
api:
  base_url: "https://api.upsignal.cloud"
  request_timeout: 10s

collection:
  interval: 30s
  upload_interval: 60s

spool:
  enabled: true
  max_age: 24h
  max_size: 50MB

logging:
  level: info
